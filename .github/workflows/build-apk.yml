name: Build & Release Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0-beta)'
        required: true
        default: 'v1.0.0-beta'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Build Next.js static export
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://ezorder-uedx.onrender.com
          NEXT_PUBLIC_MOBILE_BUILD: 'true'
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: npm run build:mobile

      - name: Sync Capacitor to Android
        working-directory: frontend
        run: npx cap sync android

      - name: Set Android SDK path for Gradle
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > frontend/android/local.properties

      - name: Make gradlew executable
        run: chmod +x frontend/android/gradlew

      - name: Build debug APK
        working-directory: frontend/android
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK exists
        run: ls -lh frontend/android/app/build/outputs/apk/debug/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: EZorder ${{ github.event.inputs.version }}
          body: |
            ## EZorder Android APK

            Build dari commit: ${{ github.sha }}

            ### Cara install di tablet:
            1. Download `app-debug.apk` di bawah
            2. Tablet: **Settings → Security → Install unknown apps** → Allow
            3. Buka fail APK dan install
          files: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: true
